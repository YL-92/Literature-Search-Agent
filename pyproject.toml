[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litsearch-agent"
version = "0.1.0"
description = "CLI agent for research-paper discovery and citation tracing."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=1.30",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "FlagEmbedding>=1.2",
    "arxiv>=2.1",
    "requests>=2.32",
    "pymupdf>=1.24",
    "networkx>=3.3",
    "langgraph>=0.2",
    "ragas>=0.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "services*", "rag*", "graph*", "agents*", "eval*"]
